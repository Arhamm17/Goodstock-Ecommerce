apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: monitoring

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-state-metrics
rules:

  - apiGroups:
      - ""
    resources:
      - nodes
      - pods
      - persistentvolumeclaims
    verbs:
      - list
      - watch

  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-state-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: monitoring

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: monitoring
spec:
  replicas: 1

  selector:
    matchLabels:
      app: kube-state-metrics

  template:
    metadata:
      labels:
        app: kube-state-metrics

    spec:
      serviceAccountName: kube-state-metrics

      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.19.1

          args:
            - --resources=pods,deployments,nodes,persistentvolumeclaims

          ports:
            - containerPort: 8080

          resources:
            requests:
              cpu: 20m
              memory: 40Mi

            limits:
              cpu: 150m
              memory: 120Mi

---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: monitoring
spec:
  type: ClusterIP

  selector:
    app: kube-state-metrics

  ports:
    - name: metrics
      port: 8080
      targetPort: 8080