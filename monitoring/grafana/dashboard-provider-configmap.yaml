apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitoring
data:
  provider.yaml: |
    apiVersion: 1

    providers:
      - name: DevOps Project
        orgId: 1
        folder: DevOps Project
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30

        options:
          path: /etc/grafana/dashboards