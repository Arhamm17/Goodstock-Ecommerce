apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 30s

    scrape_configs:

      - job_name: prometheus
        static_configs:
          - targets:
              - localhost:9090

      - job_name: kube-state-metrics
        static_configs:
          - targets:
              - kube-state-metrics.monitoring.svc.cluster.local:8080

      - job_name: node-exporter
        static_configs:
          - targets:
              - 172.31.23.204:9100

      - job_name: application-http
        metrics_path: /probe

        params:
          module:
            - http_2xx

        static_configs:
          - targets:
              - http://api-gateway.devops-ecommerce.svc.cluster.local/health
              - http://api-gateway.devops-ecommerce.svc.cluster.local/
              - http://api-gateway.devops-ecommerce.svc.cluster.local/api/products
              - http://api-gateway.devops-ecommerce.svc.cluster.local/api/orders

        relabel_configs:
          - source_labels:
              - __address__
            target_label: __param_target

          - source_labels:
              - __param_target
            target_label: instance

          - target_label: __address__
            replacement: blackbox-exporter.monitoring.svc.cluster.local:9115