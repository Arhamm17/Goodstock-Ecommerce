apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: devops-ecommerce
spec:
  replicas: 1

  selector:
    matchLabels:
      app: user-service

  template:
    metadata:
      labels:
        app: user-service

    spec:
      nodeSelector:
        workload: user
        
      containers:
        - name: user-service
          image: docker.io/arhammrashid17/devops-ecommerce-user:18-4b029f0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 4003

          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: USER_PORT

            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: REDIS_URL

          readinessProbe:
            httpGet:
              path: /health
              port: 4003
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /health
              port: 4003
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3

          resources:
            requests:
              memory: "48Mi"
              cpu: "20m"
            limits:
              memory: "128Mi"
              cpu: "250m"