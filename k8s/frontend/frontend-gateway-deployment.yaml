apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend-gateway
  namespace: devops-ecommerce

spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  minReadySeconds: 10

  selector:
    matchLabels:
      app: frontend-gateway

  template:
    metadata:
      labels:
        app: frontend-gateway

    spec:
      nodeSelector:
        workload: frontend

      containers:
        - name: frontend-gateway
          image: docker.io/arhammrashid17/devops-ecommerce-frontend:20-853d06f
          imagePullPolicy: Always

          ports:
            - containerPort: 8080

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3

          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"

            limits:
              memory: "128Mi"
              cpu: "250m"