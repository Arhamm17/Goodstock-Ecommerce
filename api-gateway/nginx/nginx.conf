worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    server_tokens off;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;
    limit_req_status 429;

    log_format api_gateway '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                          'upstream=$upstream_addr status=$upstream_status '
                          'rt=$request_time uct=$upstream_connect_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log api_gateway;

    upstream product_service {
        server product-service:4001;
    }

    upstream order_service {
        server order-service:4002;
    }

    upstream user_service {
        server user-service:4003;
    }

    upstream frontend_service {
        server frontend-gateway:8080;
    }

    include /etc/nginx/conf.d/*.conf;
}